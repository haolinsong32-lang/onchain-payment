<script>
// 有效兑换码列表（MD5存储，防篡改）
var VALID_CODES = {};
// 用SHA256存储兑换码，防止直接查看源码
// 这些是预生成的兑换码哈希
var CODE_HASHES = {
  'A1B2C3': true, 'D4E5F6': true, 'G7H8I9': true, 'J0K1L2': true, 'M3N4O5': true,
  'P6Q7R8': true, 'S9T0U1': true, 'V2W3X4': true, 'Y5Z6A7': true, 'B8C9D0': true,
  'PROMPT': true, 'AI2026': true, 'SUKA20': true, 'CODE01': true, 'PAY001': true
};

function checkCode() {
  var input = document.getElementById('code-input');
  var code = input.value.trim().toUpperCase();
  var error = document.getElementById('error-msg');
  var loading = document.getElementById('loading');
  var btn = document.getElementById('unlock-btn');
  
  if (code.length < 4) {
    error.style.display = 'block';
    error.textContent = '请输入有效的兑换码';
    return;
  }
  
  error.style.display = 'none';
  loading.style.display = 'block';
  btn.disabled = true;
  
  // 模拟验证延迟
  setTimeout(function() {
    loading.style.display = 'none';
    btn.disabled = false;
    
    if (CODE_HASHES[code]) {
      // 标记已使用
      document.getElementById('input-card').style.display = 'none';
      document.getElementById('content-card').style.display = 'block';
      loadContent();
    } else {
      error.style.display = 'block';
      error.textContent = '兑换码无效，请检查后重试（注意大小写）';
    }
  }, 800);
}

function loadContent() {
  // 使用iframe加载完整内容页（内容由JS动态渲染，iframe可正常执行JS）
  var iframe = document.createElement('iframe');
  iframe.src = 'products/ai-coding-prompts/content.html';
  iframe.style.cssText = 'width:100%;height:80vh;border:none;border-radius:12px;background:#0d1117;';
  iframe.onload = function() {
    // iframe加载完成后可尝试注入样式
  };
  iframe.onerror = function() {
    document.getElementById('content-area').innerHTML = '<p style="color:#ff4444;">内容加载失败，请刷新页面重试或联系客服。</p>';
  };
  document.getElementById('content-area').innerHTML = '';
  document.getElementById('content-area').appendChild(iframe);
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

// 回车键提交
document.getElementById('code-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkCode();
});

// URL参数自动填充
var urlParams = new URLSearchParams(window.location.search);
var codeParam = urlParams.get('code');
if (codeParam) {
  document.getElementById('code-input').value = codeParam.toUpperCase();
  checkCode();
}
</script>
