- Button.test.tsx 含行为与快照。
- 3条快照最佳实践。
- 明确交互逻辑必须行为测试。`},
{t:"自定义 React Hook 测试",p:`<span class="label">【角色】</span>你是 Hooks 测试专家。

<span class="label">【任务】</span>测 useToggle(initial=false) 返回 [value,toggle,setTrue,setFalse]：
1. renderHook + act。
2. 测初始值/toggle/setTrue/setFalse。
3. initial=true 初始值正确。
4. 状态更新包 act()。
5. 若 Hook 用 useEffect 订阅，unmount 时验证清理调用。

<span class="out">【输出格式】</span>
- useToggle.ts 与 .test.ts。
- 带订阅的 Hook 测试示例(jest.fn 断言清理)。
- 说明 result.current 访问模式。`},
{t:"Express 中间件与接口测试(supertest)",p:`<span class="label">【角色】</span>你是后端测试工程师。

<span class="label">【任务】</span>用 jest+supertest 测 Express：
1. GET /api/users 返回200与数组。
2. POST 缺 name 返回422。
3. GET /api/users/9999 返回404。
4. mongodb-memory-server/sqlite memory 作测试库。
5. 每测试前清空数据。
6. 鉴权中间件：无token 401，有效token 200。

<span class="out">【输出格式】</span>
- app.js(导出app) 与 .api.test.js。
- 内存库 setup/teardown。
- 说明接口测试更能发现集成问题。`},
{t:"参数化/表驱动测试",p:`<span class="label">【角色】</span>你是追求覆盖率与简洁的工程师。

<span class="label">【任务】</span>表驱动测 validatePassword(pwd)（长度≥8、含大小写、数字、特殊字符）：
1. 数组定义 {pwd,expected,reason}。
2. 覆盖：全满足、缺大写、长度不足、空串、仅数字。
3. Jest it.each 版与 pytest parametrize 版。
4. 断言信息含 reason。
5. 新增场景只加一行数据。

<span class="out">【输出格式】</span>
- validatePassword 实现。
- .test.js(it.each) 与 test_password.py(parametrize)。
- 3个优点。`}
]},
{cat:"代码审查",icon:"🔍",items:[
{t:"安全审查清单(注入/认证/敏感信息)",p:`<span class="label">【角色】</span>你是应用安全工程师，攻击者视角。

<span class="label">【任务】</span>审查登录与订单查询代码：
1. SQL注入：是否拼接，应参数化。
2. XSS：用户输入未转义渲染。
3. 认证：密码 bcrypt/argon2(禁明文/MD5)、JWT密钥硬编码、cookie httpOnly/secure/sameSite。
4. 越权：查订单校验 order.userId===req.user.userId(IDOR)。
5. 敏感信息：日志打印密码/token、错误泄露堆栈。
6. 依赖漏洞(npm audit/pip-audit)。
7. 登录限流防爆破。

<span class="out">【输出格式】</span>
- 表格：序号|风险项|严重程度|位置|修复建议。
- 高危项给修复代码。
- 3条 CI 安全检查。`},
{t:"SOLID 原则违规审查",p:`<span class="label">【角色】</span>你是 OO 设计审查专家。

<span class="label">【任务】</span>对照 SOLID 审查代码：
1. SRP：类/函数是否做多于一件事。
2. OCP：新增类型是否须改已有函数(switch扩张)。
3. LSP：子类是否改变父类语义或抛未声明异常。
4. ISP：胖接口强迫实现不需要方法。
5. DIP：高层是否直接依赖具体实现(业务类里 new MySQLConnection)。
用依赖注入/策略/接口拆分修正。

<span class="out">【输出格式】</span>
- S/O/L/I/D 各给违规点+修复代码。
- 每条一句解释。
- 一句话总结核心目标。`},
{t:"错误处理审查(空catch/吞错/粒度)",p:`<span class="label">【角色】</span>你是稳定性审查工程师。

<span class="label">【任务】</span>审查异步代码错误处理：
1. 空 catch(e){} 吞错。
2. catch 只 console.log 不抛不降级。
3. catch 过宽掩盖编程bug。
4. throw 'error' 字符串无堆栈。
5. 未区分可恢复(校验失败)与不可恢复(DB连不上)。
6. async 漏 await 致 rejection 无人处理。
给自定义错误类/错误边界/统一日志/降级重试。

<span class="out">【输出格式】</span>
- 问题清单(编号+反例)。
- 重构代码(含 AppError 分层)。
- 错误处理三问。`},
{t:"异步代码审查(async/await 常见坑)",p:`<span class="label">【角色】</span>你是异步代码审查专家。

<span class="label">【任务】</span>审查 async/await 代码：
1. 串行 await 无依赖请求(应 Promise.all)。
2. forEach 中 async(不等待，应 for...of/Promise.all)。
3. 漏 await 致未捕获 rejection。
4. Promise.all 一败全败(需 allSettled/单独catch)。
5. 无超时可能永久挂起。
6. 循环逐条查库(N+1，应批量)。
修复并对比性能。

<span class="out">【输出格式】</span>
- 每问题反例+修复。
- all vs allSettled 建议。
- withTimeout(promise,ms) 工具。`},
{t:"命名与可读性审查",p:`<span class="label">【角色】</span>你是可读性审查者。

<span class="label">【任务】</span>审查代码命名：
1. 变量名是否表达意图(data/info/temp/obj/res 替换)。
2. 布尔用 is/has/can/should 前缀。
3. 函数名动词开头且与返回/副作用一致(getX 不发请求，fetchX 才异步)。
4. 误导性缩写(usr/cnt/tmp)。
5. 可搜索(避免单字母除循环计数)。
6. 同一概念前后一致(user/customer/account)。

<span class="out">【输出格式】</span>
- 表格：原名|新名|理由。
- 重命名后片段。
- 3条命名原则。`},
{t:"注入与 XSS 专项审查",p:`<span class="label">【角色】</span>你是 Web 安全审查员，专注 OWASP。

<span class="label">【任务】</span>审查"用户评论+展示"功能：
1. SQL注入：参数化。
2. XSS：dangerouslySetInnerHTML/v-html 直接渲染；富文本用 DOMPurify 消毒。
3. CSRF：token 或 SameSite。
4. 限流。
5. 内容长度/类型校验。
6. CSP 头降低 XSS 影响。

<span class="out">【输出格式】</span>
- 漏洞清单与修复代码。
- DOMPurify 示例与 CSP(Nginx/Helmet)。
- 存储型 vs 反射型 XSS 区别。`},
{t:"第三方依赖审查",p:`<span class="label">【角色】</span>你是供应链安全工程师。

<span class="label">【任务】</span>审查项目依赖：
1. npm audit/pip-audit 查 CVE，区分运行时与 dev。
2. 无人维护包(发布时间/issues)。
3. 包体积过大(只用到一个函数的 lodash 整体引入)。
4. 依赖混淆风险(内部包名被抢注)。
5. 版本锁定(lock 文件)。
6. 可疑 postinstall 脚本。

<span class="out">【输出格式】</span>
- 报告模板(依赖|版本|风险|建议)。
- 按需引入 lodash 示例。
- CI 加 npm audit --audit-level=high。`},
{t:"可访问性(A11y)审查",p:`<span class="label">【角色】</span>你是前端可访问性审查员，熟悉 WCAG 2.1。

<span class="label">【任务】</span>审查表单页面：
1. 控件关联 label(htmlFor/aria-label)。
2. 图片 alt(装饰性 alt="")。
3. 按钮有可识别名称。
4. 颜色对比度(正文4.5:1)。
5. 键盘可操作，焦点可见顺序合理。
6. 错误用 aria-invalid/aria-describedby。
7. 动态内容用 aria-live。

<span class="out">【输出格式】</span>
- 问题清单与严重程度。
- 修复后表单 JSX。
- 推荐 axe/eslint-plugin-jsx-a11y。`},
{t:"Pull Request Diff 结构化审查",p:`<span class="label">【角色】</span>你是 Tech Lead，负责高质量 CR。

<span class="label">【任务】</span>给 PR 审查标准化流程与模板：
1. 目的(对应 issue)。2. 正确性(边界/错误)。3. 安全(注入/越权/泄露)。
4. 可维护性(命名/长度/重复/复杂度)。5. 测试(有无/覆盖/稳定)。
6. 性能(N+1/重渲染/大对象)。7. 兼容性(API/schema/迁移)。
评论区分 Blocker/Suggestion/Question/Praise。

<span class="out">【输出格式】</span>
- Markdown 审查意见模板。
- 建设性评论示例(问题+原因+代码建议)。
- CR 首要目标是质量与知识共享。`},
{t:"性能反模式审查",p:`<span class="label">【角色】</span>你是性能审查工程师。

<span class="label">【任务】</span>审查代码找性能反模式：
1. 前端：render 调昂贵函数、内联对象 prop 致重渲染、缺 key/index 作 key、未虚拟化、未懒加载。
2. 后端：N+1、循环查库/调远程、缺索引、同步IO阻塞、未分页全表、未缓存。
3. 通用：重复计算未缓存、大对象深拷贝、循环重复编译正则、同步写日志。

<span class="out">【输出格式】</span>
- 分类列反模式/问题代码/修复代码。
- DataLoader 或批量查询修 N+1 示例。
- useMemo/useCallback 合理使用判断。`}
]},
{cat:"性能优化",icon:"🚀",items:[
{t:"React 重渲染优化(memo/useMemo/useCallback)",p:`<span class="label">【角色】</span>你是 React 性能优化专家。

<span class="label">【任务】</span>列表页输入时所有 <ListItem> 都重渲染：
1. 用 DevTools Profiler 定位（Highlight updates）。
2. React.memo 包裹 ListItem，useMemo 缓存计算，useCallback 稳定回调。
3. 内联对象/数组 prop 会让 memo 失效，需提升或 useMemo。
4. 状态下放：输入框 state 下移独立组件。
5. 给前后代码与 Profiler 对比。
6. 不要无脑 memo，先 Profiler 验证。

<span class="out">【输出格式】</span>
- 优化前后组件代码。
- 4个 memo 失效原因。
- 何时该用 useMemo/useCallback 判断标准。`},
{t:"慢 SQL 分析与索引优化(EXPLAIN)",p:`<span class="label">【角色】</span>你是数据库性能工程师，精通 EXPLAIN。

<span class="label">【任务】</span>SQL 耗时3秒：
SELECT * FROM orders WHERE customer_id=? AND status='paid' ORDER BY created_at DESC LIMIT 20;
1. EXPLAIN 分析：type 是否 ALL、key 是否命中、rows 扫描行数、Extra 是否 filesort/temporary。
2. 设计复合索引 (customer_id,status,created_at)，说明最左前缀与排序字段顺序。
3. 避免 SELECT *。
4. EXPLAIN 验证 type=ref、无 filesort。
5. 说明回表与覆盖索引。

<span class="out">【输出格式】</span>
- 优化前 EXPLAIN 解读(模拟)。
- 建索引 SQL 与优化后 EXPLAIN。
- 复合索引顺序3条经验。`},
{t:"修复 N+1 查询",p:`<span class="label">【角色】</span>你是 ORM 与数据库性能工程师。

<span class="label">【任务】</span>循环查每用户订单，100用户产生101条SQL：
users.forEach(u => { u.orders = await db.query('SELECT * FROM orders WHERE user_id=?',[u.id]); });
1. 指出 N+1 对连接池与延迟影响。
2. 修复：先查用户，再 WHERE user_id IN(...) 一次查订单，内存分组组装。
3. ORM 方案：Prisma include、Django select_related/prefetch_related、TypeORM relations。
4. IN 过长则分批(500)或游标。

<span class="out">【输出格式】</span>
- 原生批量查询+内存组装(Node/Python)。
- Prisma include 示例。
- 如何用日志识别 N+1。`},
{t:"长列表虚拟化(虚拟滚动)",p:`<span class="label">【角色】</span>你是前端渲染性能工程师。

<span class="label">【任务】</span>展示10000条数据页面卡死：
1. 解释 DOM 节点过多的布局/绘制/内存开销。
2. 虚拟滚动：只渲染可视区+缓冲，transform:translateY 定位。
3. 基于 react-window（FixedSizeList 与 VariableSizeList）。
4. scrollToItem 滚动到指定项。
5. 不引库则给最简原理实现（计算 startIndex/endIndex、总高占位）。

<span class="out">【输出格式】</span>
- react-window 示例。
- 原生 JS 核心实现(约50行)。
- 两个注意点(行高测量、搜索定位)。`},
{t:"图片懒加载与现代格式",p:`<span class="label">【角色】</span>你是前端性能工程师，关注 Core Web Vitals。

<span class="label">【任务】</span>优化含大量图片的列表页：
1. loading="lazy" decoding="async" 原生懒加载。
2. IntersectionObserver 自定义懒加载，rootMargin 提前加载。
3. WebP/AVIF 格式，<picture>+<source type> 回退 JPEG。
4. srcset/sizes 响应式图片。
5. width/height 或 aspect-ratio 防 CLS。
6. LCP 图片不懒加载，preload/fetchpriority="high"。

<span class="out">【输出格式】</span>
- 完整 <picture>+srcset 示例。
- IntersectionObserver 懒加载组件。
- LCP 优化3要点。`},
{t:"打包体积分析与代码分割",p:`<span class="label">【角色】</span>你是前端构建与产物体积工程师。

<span class="label">【任务】</span>首屏 bundle 2MB：
1. webpack-bundle-analyzer/rollup-plugin-visualizer 分析。
2. 路由级分割：React.lazy+Suspense。
3. 大依赖按需引入或替换（moment→dayjs、lodash-es、echarts tree-shaking）。
4. Tree-shaking：ESM import、sideEffects 配置。
5. 动态 import 大组件。
6. gzip/brotli、contenthash 长期缓存。

<span class="out">【输出格式】</span>
- React.lazy 路由分割代码。
- dayjs 替换与 lodash 按需示例。
- 5个手段按收益排序。`},
{t:"缓存策略(HTTP/CDN/应用层)",p:`<span class="label">【角色】</span>你是缓存架构工程师。

<span class="label">【任务】</span>为内容型网站设计多级缓存：
1. HTTP：静态资源 Cache-Control:public,max-age=31536000,immutable+内容哈希；HTML no-cache+ETag。
2. CDN 缓存图片/静态资源。
3. 应用层 Redis 缓存热点，TTL，更新失效(cache-aside)。
4. 防击穿/穿透/雪崩：互斥锁、空值缓存、TTL 随机抖动。
5. "先更新DB再删缓存"及原因。

<span class="out">【输出格式】</span>
- Nginx 静态缓存配置片段。
- Redis cache-aside 工具函数。
- 击穿/穿透/雪崩分别解释。`},
{t:"滚动与 resize 防抖节流",p:`<span class="label">【角色】</span>你是前端交互性能工程师。

<span class="label">【任务】</span>滚动/resize 频繁触发卡顿：
1. 防抖(只执行最后一次)与节流(固定频率)区别与场景。
2. requestAnimationFrame 节流滚动，比 setTimeout 更贴帧。
3. IntersectionObserver 替代 scroll 判断元素进入视口。
4. ResizeObserver 替代 window resize 监听元素尺寸。
5. passive:true 提升滚动。
6. 卸载移除监听。

<span class="out">【输出格式】</span>
- debounce 与 throttle 的 TS 实现。
- rAF 节流与 IntersectionObserver 示例。
- passive 为何提升流畅度。`},
{t:"内存泄漏排查与清理",p:`<span class="label">【角色】</span>你是内存与生命周期专家。

<span class="label">【任务】</span>SPA 切换页面内存持续增长：
1. 常见泄漏：未清理 setInterval/setTimeout、未移除事件监听、未取消订阅(WebSocket/EventEmitter)、闭包持有大对象、分离DOM、控制台打印大对象、Map/Set 只增不删。
2. Chrome DevTools Memory：堆快照对比、Allocation timeline、Detached DOM。
3. useEffect 清理函数中清除；Vue beforeUnmount。
4. "挂载订阅、卸载取消"标准模板。
5. 避免全局挂数据。

<span class="out">【输出格式】</span>
- 6种泄漏与修复代码。
- React/Vue 清理模板。
- 堆快照对比步骤。`},
{t:"Web Worker 卸载密集计算",p:`<span class="label">【角色】</span>你是前端多线程与流畅度工程师。

<span class="label">【任务】</span>解析5MB JSON 并复杂聚合，UI 卡顿1-2秒：
1. 解释 JS 单线程与长任务阻塞主线程。
2. 迁移到 Web Worker：主线程 postMessage，Worker 算完 postMessage。
3. Transferable Objects(ArrayBuffer) 转移所有权避免克隆。
4. Worker 与主线程代码含错误处理与 terminate。
5. Comlink 简化通信示例。
6. Worker 限制(不能访问 DOM/window)。

<span class="out">【输出格式】</span>
- worker.js 与 main.js。
- Comlink 版示例。
- 何类任务适合/不适合 Worker。`}
]},
{cat:"正则表达式",icon:"🔤",items:[
{t:"邮箱校验正则",p:`<span class="label">【角色】</span>你是正则工程师，注重正确性与可维护性。

<span class="label">【任务】</span>编写实用邮箱校验正则（不追求 RFC 5322 完全合规）：
1. 本地部分允许字母数字与 ._%-（不能以.开头/结尾、不能连续..）；@ 后域名含字母数字连字符，点分隔，TLD 至少2字母。
2. 给出正则与每部分注释。
3. 说明正则只做基础校验，最终靠验证邮件。
4. JS 与 Python 两版写法。
5. 合法/非法用例各5个。

<span class="out">【输出格式】</span>
- 带注释正则。
- JS/Python 校验函数。
- 测试用例表。`},
{t:"中国大陆手机号校验",p:`<span class="label">【角色】</span>你是熟悉国内号段的正则工程师。

<span class="label">【任务】</span>编写中国大陆手机号正则：
1. 11位数字，1开头。
2. 第二位 3-9（覆盖13x-19x）。
3. 严格版 ^1[3-9]\\d{9}$ 与文本提取版。
4. 不要写死 1[358] 过时规则。
5. 支持 +86/0086 前缀与空格横线的清洗+校验函数。

<span class="out">【输出格式】</span>
- 正则与清洗函数(先去非数字再校验)。
- 合法/非法用例。
- 清洗后再校验更易维护。`},
{t:"从文本提取 URL",p:`<span class="label">【角色】</span>你是文本处理工程师。

<span class="label">【任务】</span>从文本提取所有 URL：
1. 支持 http/https/ftp，也支持无协议 www.。
2. 正确处理 URL 后标点(句号逗号括号)不包含进 URL。
3. 支持域名/端口/路径/查询/锚点。
4. JS matchAll 示例。
5. 给严格"必须含协议"版用于安全场景。
6. 复杂情况用 new URL()。

<span class="out">【输出格式】</span>
- 正则与提取代码。
- 测试文本与结果。
- 宽松 vs 严格版用途。`},
{t:"密码强度校验正则",p:`<span class="label">【角色】</span>你是表单校验工程师。

<span class="label">【任务】</span>正则校验密码：至少8位，含大写、小写、数字、特殊字符(!@#$%^&*)：
1. 多个正向先行断言 (?=.*[a-z]) 组合。
2. 正则与每部分解释。
3. 返回强度等级(弱/中/强)而非布尔：≥12且四类为强，8-11且三类为中。
4. 建议多条小正则分别检测给针对性提示。

<span class="out">【输出格式】</span>
- 组合断言正则。
- checkPasswordStrength 函数。
- 测试用例与预期。`},
{t:"提取 CSS 颜色值(hex/rgb/rgba)",p:`<span class="label">【角色】</span>你是文本与样式处理工程师。

<span class="label">【任务】</span>从 CSS 提取颜色：
1. hex：#fff/#ffffff/#ffffffff(8位alpha)。
2. rgb/rgba：rgb(255,0,0)、rgba(255,0,0,.5)，允许空格。
3. 命名捕获组。
4. JS matchAll 提取。
5. hex 简写展开6位函数。

<span class="out">【输出格式】</span>
- 命名捕获组正则。
- 提取代码与展开函数。
- 测试用例。`},
{t:"日期格式校验与提取",p:`<span class="label">【角色】</span>你是日期处理工程师。

<span class="label">【任务】</span>正则匹配校验日期：
1. YYYY-MM-DD，捕获组取年月日。
2. 正则基础范围：月份01-12、日期01-31，但无法准确判大小月闰年。
3. 两阶段：正则初步匹配 + 代码 Date/库真实校验。
4. 给 YYYY/MM/DD 与 DD-MM-YYYY 版。
5. 不要用正则做日期运算。

<span class="out">【输出格式】</span>
- 正则与两阶段校验函数(JS/Python)。
- 合法/非法用例(含2024-02-29与2023-02-29)。
- 正则边界说明。`},
{t:"IPv4 地址校验",p:`<span class="label">【角色】</span>你是网络数据处理工程师。

<span class="label">【任务】</span>正则匹配 IPv4：
1. 四段 0-255 数字点分。
2. 不匹配256、01前导零、空段。
3. 两版：冗长准确0-255匹配；简单 \\d{1,3} 后代码判范围(推荐)。
4. 从日志提取 IP 版(带边界)。
5. IPv6 用库(ip-address)。

<span class="out">【输出格式】</span>
- 准确 IPv4 正则与注释。
- 粗匹配+代码校验函数。
- 合法/非法用例。`},
{t:"去除/提取 HTML 标签",p:`<span class="label">【角色】</span>你是文本处理工程师，警惕正则解析 HTML 局限。

<span class="label">【任务】</span>
1. stripHtml(html) 去标签得纯文本(正则 /<[^>]*>/g)，处理 &nbsp; 等实体。
2. extractLinks(html) 提取所有 <a href>。
3. 警告：正则不能可靠解析任意 HTML(嵌套/注释/属性中>/畸形)，生产用 DOMParser/cheerio/BeautifulSoup。
4. 安全消毒必须用 DOMPurify。

<span class="out">【输出格式】</span>
- stripHtml 与 extractLinks JS 实现。
- DOMParser/cheerio 稳妥替代。
- 3个失败案例。`},
{t:"驼峰/短横线/下划线互转",p:`<span class="label">【角色】</span>你是命名转换工程师。

<span class="label">【任务】</span>实现三组互转：
1. camelCase <-> kebab-case。
2. camelCase <-> snake_case。
3. kebab-case <-> snake_case。
4. 正则+replace，正确处理连续大写(HTMLElement -> html-element，不要变成 h-t-m-l-element)。
5. TS 实现。
6. 边界用例(空串/全大写/已有分隔符)。

<span class="out">【输出格式】</span>
- 三个转换函数。
- 连续大写处理正则思路。
- 测试用例与预期。`},
{t:"数字千分位格式化",p:`<span class="label">【角色】</span>你是数字格式化工程师。

<span class="label">【任务】</span>正则给数字加千分位：
1. 整数部分从右每3位加逗号(1234567 -> 1,234,567)。
2. 小数不变(1234567.89 -> 1,234,567.89)。
3. 负数处理。
4. 正则 /\\B(?=(\\d{3})+(?!\\d))/g 解释。
5. 生产推荐 Intl.NumberFormat/toLocaleString，正则适合无依赖。

<span class="out">【输出格式】</span>
- 正则版与 Intl 版函数。
- 逐符号解释正则。
- 测试用例。`}
]},
{cat:"SQL查询",icon:"🗄️",items:[
{t:"查找重复记录",p:`<span class="label">【角色】</span>你是 SQL 工程师，熟悉数据清洗。

<span class="label">【任务】</span>在 users 表找重复 email：
1. GROUP BY email HAVING COUNT(*)>1 找重复邮箱及次数。
2. 查看完整重复行用 ROW_NUMBER() OVER(PARTITION BY email ORDER BY id)。
3. 区分完全重复与业务键重复。
4. MySQL 8+/PostgreSQL 窗口函数写法。

<span class="out">【输出格式】</span>
- GROUP BY 版与窗口函数版 SQL。
- 适用场景说明。
- 建唯一索引防未来重复 DDL。`},
{t:"删除重复保留最小 ID",p:`<span class="label">【角色】</span>你是数据清洗 SQL 工程师。

<span class="label">【任务】</span>删除 users 重复 email，每邮箱保留最小 id：
1. 自连接：DELETE u1 FROM users u1 JOIN users u2 ON u1.email=u2.email AND u1.id>u2.id。
2. 窗口函数：DELETE WHERE id IN (SELECT id FROM (SELECT id,ROW_NUMBER() OVER(PARTITION BY email ORDER BY id) rn FROM users) t WHERE rn>1)。
3. 删除前先 SELECT 验证，事务中执行。
4. NULL email 处理。
5. 删除后加唯一索引。

<span class="out">【输出格式】</span>
- 两种删除 SQL(标注数据库)。
- 事务包裹与先查后删流程。
- 唯一索引 DDL。`},
{t:"高效分页(深分页优化)",p:`<span class="label">【角色】</span>你是 SQL 性能工程师。

<span class="label">【任务】</span>实现分页并优化深分页：
1. 基础 LIMIT ?,?，page 从1。
2. 深分页问题：OFFSET 100000 仍扫描丢弃前10万行。
3. 游标 seek 分页：WHERE (created_at,id)<(?,?) ORDER BY created_at DESC,id DESC LIMIT ?，用上一页末条定位。
4. 游标分页不能跳页但性能稳定，适合无限滚动。
5. 总数查询与缓存。

<span class="out">【输出格式】</span>
- LIMIT/OFFSET 版与游标版 SQL。
- 解释需唯一排序字段(id 做 tie-breaker)。
- 应用层代码示例。`},
{t:"每组 Top N 记录",p:`<span class="label">【角色】</span>你是熟悉窗口函数的 SQL 工程师。

<span class="label">【任务】</span>查每部门工资最高3名员工：
1. ROW_NUMBER()/RANK()/DENSE_RANK() OVER(PARTITION BY dept_id ORDER BY salary DESC)。
2. 三者区别：ROW_NUMBER 强行编号、RANK 并列跳号、DENSE_RANK 并列不跳号。
3. 外层过滤 rn<=3。
4. 并列第3用 RANK 可能多于3人。
5. MySQL 8+/PG 写法，MySQL 5.7 用户变量老式写法。

<span class="out">【输出格式】</span>
- 三种窗口函数 SQL 与结果差异。
- 示例数据与结果。
- PARTITION BY 与 GROUP BY 区别。`},
{t:"累计求和(Running Total)",p:`<span class="label">【角色】</span>你是熟悉窗口函数的数据分析师。

<span class="label">【任务】</span>计算每日销售额累计：
1. 表 sales(date,amount)，查每天 amount 与月初至今 running_total。
2. SUM(amount) OVER(ORDER BY date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)。
3. 按月分区 PARTITION BY DATE_FORMAT(date,'%Y-%m')。
4. RANGE 与 ROWS 区别(重复日期时不同)。

<span class="out">【输出格式】</span>
- 累计求和 SQL(含按月分区)。
- ROWS 与 RANGE 帧区别。
- 示例输出表格。`},
{t:"行转列(Pivot)",p:`<span class="label">【角色】</span>你是 SQL 数据分析工程师。

<span class="label">【任务】</span>把每月销售额从行转列：
1. 条件聚合：SUM(CASE WHEN MONTH(date)=1 THEN amount END) AS Jan。
2. 12个月完整 SQL。
3. PostgreSQL 用 FILTER(WHERE...)。
4. 月份动态不固定需动态 SQL(PREPARE/存储过程)。
5. 反向列转行用 UNION ALL/UNPIVOT。

<span class="out">【输出格式】</span>
- CASE 版与 FILTER 版。
- MySQL PREPARE 动态列思路。
- BI 工具透视更方便。`},
{t:"递归 CTE 查树形结构",p:`<span class="label">【角色】</span>你是熟悉递归查询的 SQL 工程师。

<span class="label">【任务】</span>表 categories(id,name,parent_id) 树形分类：
1. 某分类及所有后代(向下递归)。
2. 某分类及所有祖先(向上递归)。
3. WITH RECURSIVE(MySQL 8+/PG)。
4. 计算 depth 与 path(CONCAT)。
5. 防无限循环：深度限制或检测循环。

<span class="out">【输出格式】</span>
- 向下与向上递归两条 SQL。
- 锚点成员与递归成员解释。
- CEO 下组织树示例。`},
{t:"同比/环比增长",p:`<span class="label">【角色】</span>你是熟悉时间序列对比的数据分析师。

<span class="label">【任务】</span>表 sales(month,amount)，计算每月：
1. 同比增长率(与去年同月)：(本月-去年同月)/去年同月*100。
2. 环比(与上月)。
3. LAG(amount,12) 取去年同月，LAG(amount) 取上月。
4. NULL 致除零用 NULLIF 与 COALESCE。
5. ROUND 两位小数。

<span class="out">【输出格式】</span>
- 含同比环比完整 SQL。
- LAG 偏移参数解释。
- 除零与缺失处理。`},
{t:"找出缺失记录(NOT IN/NOT EXISTS/LEFT JOIN)",p:`<span class="label">【角色】</span>你是关注正确性与性能的 SQL 工程师。

<span class="label">【任务】</span>找"从未下单的用户"：
1. 三种写法：NOT IN 子查询、NOT EXISTS 相关子查询、LEFT JOIN...WHERE orders.id IS NULL。
2. NOT IN 陷阱：子查询含 NULL 则 NOT IN 返回空(三值逻辑)，推荐 NOT EXISTS。
3. 性能：NOT EXISTS 与 LEFT JOIN 通常优化为反连接。
4. 进阶：递归 CTE 生成日期序列再 LEFT JOIN 找连续登录缺失日期。

<span class="out">【输出格式】</span>
- 三种写法 SQL。
- 示例数据演示 NOT IN 含 NULL 错误。
- 推荐结论。`},
{t:"移动平均值(Moving Average)",p:`<span class="label">【角色】</span>你是熟悉窗口帧的数据分析师。

<span class="label">【任务】</span>计算7日移动平均：
1. 表 quotes(date,price)，AVG(price) OVER(ORDER BY date ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)。
2. 前6天不足时 AVG 基于已有行；要求满7天则外层 COUNT>=7 过滤。
3. SMA vs EMA(EMA 需递归 CTE 或应用层)。
4. 按股票代码 PARTITION BY symbol。

<span class="out">【输出格式】</span>
- 7日移动平均 SQL(含分区)。
- 6 PRECEDING 帧含义。
- 不足窗口大小的处理。`}
]},
{cat:"文档生成",icon:"📝",items:[

{t:"生成项目 README",p:`<span class="label">【角色】</span>你是开发者关系工程师，擅长写 README。

{t:"生成 OpenAPI/Swagger 接口文档",p:`<span class="label">【角色】</span>你是 API 设计工程师，熟悉 OpenAPI 3.0。

{t:"生成 CHANGELOG(Keep a Changelog)",p:`<span class="label">【角色】</span>你是发布工程师，遵循 Keep a Changelog 与语义化版本。

{t:"为复杂代码添加解释性注释",p:`<span class="label">【角色】</span>你是注重"为什么"而非"做什么"的工程师。

<span class="label">【任务】</span>为复杂/反直觉代码(位运算权限或浏览器 bug hack)加注释：

- 坏注释 vs 好注释对比。

{t:"生成 TypeDoc 文档",p:`<span class="label">【角色】</span>你是 TypeScript 文档工程师。

{t:"用 Mermaid 画架构/流程图",p:`<span class="label">【角色】</span>你是技术文档可视化工程师。

{t:"生成贡献指南 CONTRIBUTING.md",p:`<span class="label">【角色】</span>你是开源社区维护者。

<span class="label">【任务】</span>为开源项目生成 CONTRIBUTING.md：

{t:"为 Python 函数写 docstring(Google 风格)",p:`<span class="label">【角色】</span>你是 Python 文档工程师，遵循 Google Python Style Guide。

{t:"生成错误码文档",p:`<span class="label">【角色】</span>你是 API 文档工程师。

<span class="label">【任务】</span>设计错误码文档：
1. 统一错误结构 { code, message, details?, traceId }。
2. 分段：10xxx 通用、20xxx 用户、30xxx 订单、40xxx 支付。
3. 表格列至少15个：错误码、HTTP状态、含义、触发场景、客户端建议。
4. 代码中为常量/枚举。
5. TS 错误码枚举定义。
6. traceId 贯穿日志与返回。

<span class="out">【输出格式】</span>
- Markdown 错误码表。
- ErrorCode 枚举与 AppError 类代码。
- 客户端按 code 友好提示建议。`}
]},
{cat:"Git工作流",icon:"🌿",items:[
{t:"编写规范 Conventional Commit",p:`<span class="label">【角色】</span>你是 Git 工作流工程师，遵循 Conventional Commits。

<span class="label">【任务】</span>根据改动生成 commit message：
- 新增用户头像上传
- 修复订单列表分页第0页 bug
- 破坏性变更：删除废弃 /api/v1/login
1. 格式 <type>(<scope>): <subject>，type 为 feat/fix/docs/style/refactor/perf/test/chore/ci。
2. subject 祈使句、首字母小写、不加句号、≤50字符。
3. body 说明"是什么/为什么"，每行≤72字符。
4. BREAKING CHANGE 在 footer 说明迁移。
5. 关联 issue 用 Closes #123。

<span class="out">【输出格式】</span>
- 三条完整 commit message(含 body/footer)。
- 为何用祈使句。
- 推荐 commitlint+husky。`},
{t:"交互式 rebase 合并提交(squash/fixup)",p:`<span class="label">【角色】</span>你是 Git 历史整理工程师。

<span class="label">【任务】</span>特性分支有5个琐碎提交(wip/fix typo/调试)，合并前整理为1-2个干净提交：
1. git rebase -i HEAD~5。
2. 解释 pick/squash/fixup/reword/drop/edit。
3. 后续提交 fixup 到第一个，保留首个 message。
4. 需改 message 用 reword。
5. 冲突解决后 git add→git rebase --continue；放弃 --abort。
6. 已推送分支用 git push --force-with-lease(比 --force 安全)。

<span class="out">【输出格式】</span>
- rebase todo 前后对比。
- 完整命令流程。
- 公共分支不要 rebase 原因。`},
{t:"解决合并冲突",p:`<span class="label">【角色】</span>你是 Git 冲突调解工程师。

<span class="label">【任务】</span>git merge 出现冲突：
1. 解释 <<<<<<<、=======、>>>>>>> 含义(HEAD vs 被合并分支)。
2. 流程：git status→编辑选择保留并删标记→git add→git commit(--continue)。
3. "双方改同一行"与"一方改一方删文件"分别处理。
4. 推荐 VS Code/IntelliJ 三向合并或 git mergetool。
5. 示例冲突片段与解决结果。
6. git merge --abort 回到合并前。

<span class="out">【输出格式】</span>
- 冲突文件示例与解决后代码。
- 完整命令序列。
- 3条减少冲突团队实践。`},
{t:"git bisect 定位引入 bug 的提交",p:`<span class="label">【角色】</span>你是 Git 排障工程师，擅长二分查找。

<span class="label">【任务】</span>v1.0 正常、v2.0 异常，中间200提交，定位首个坏提交：
1. git bisect start。
2. git bisect bad 标记当前，git bisect good v1.0。
3. Git 自动 checkout 中间提交，测试后 good/bad 标记直到定位。
4. 自动化：git bisect run <test-script>，退出码0=good/1=bad/125=skip。
5. 定位后 git bisect reset。
6. npm test 作测试脚本示例。

<span class="out">【输出格式】</span>
- 手动 bisect 命令序列。
- bisect run 自动化示例。
- 要求每提交可独立构建/测试。`},
{t:"cherry-pick 选择性合并提交",p:`<span class="label">【角色】</span>你是 Git 分支管理工程师。

<span class="label">【任务】</span>develop 上一个 bugfix 需紧急合入 main 发布，但 develop 有未完成功能：
1. git cherry-pick <hash> 单独应用该提交。
2. 多个：A B C 或区间 A..B。
3. 冲突解决后 --continue；放弃 --abort。
4. -x 追加来源哈希便于追溯。
5. -n/--no-commit 只应用不提交。
6. cherry-pick 产生新哈希；长期维护分支应 merge 避免重复。

<span class="out">【输出格式】</span>
- 完整 cherry-pick 流程。
- -x/-n 示例。
- 对比 cherry-pick 与 merge 场景。`},
{t:"reset vs revert 选择",p:`<span class="label">【角色】</span>你是 Git 历史安全工程师。

<span class="label">【任务】</span>错误提交已推送远程需撤销，区分 reset 与 revert：
1. git reset --soft：回退指针保留改动在暂存区(本地未推送整理)。
2. --mixed(默认)：保留改动在工作区不暂存。
3. --hard：彻底丢弃提交与改动(危险)。
4. git revert：生成新反向提交，不改写历史(适合已推送公共分支)。
5. 已推送共享分支绝不用 reset --hard+force push。
6. 撤销最近一次提交两种正确做法。

<span class="out">【输出格式】</span>
- 表格对比 reset 三模式与 revert。
- 本地未推送 vs 已推送场景示例。
- git reflog 找回误 reset。`},
{t:"stash 临时保存工作区",p:`<span class="label">【角色】</span>你是 Git 日常工作流工程师。

<span class="label">【任务】</span>feature 开发到一半需紧急切 main 修 bug，改动不能提交：
1. git stash push -m "wip: 用户列表"。
2. -u/--include-untracked 保存未跟踪文件。
3. git stash list 查看。
4. git stash pop 恢复并删除；apply 恢复但保留。
5. git stash show -p stash@{0} 查看具体改动。
6. stash 不包含 ignored 文件；pop 冲突需手动解决。
7. stash 只是临时，长期未完成应提交临时分支。

<span class="out">【输出格式】</span>
- 完整 stash 工作流命令。
- apply vs pop、含未跟踪示例。
- 2个注意事项。`},
{t:"GitFlow 分支策略",p:`<span class="label">【角色】</span>你是 Git 流程架构师，熟悉 GitFlow 与 GitHub Flow。

<span class="label">【任务】</span>为有版本发布周期团队设计 GitFlow：
1. 长期分支：main(生产打tag)、develop(集成)。
2. 临时分支：feature/*(develop切出合回develop)、release/*(发布准备只修bug，合入main与develop并打tag)、hotfix/*(main切出修线上，合入main与develop)。
3. 命名规范与生命周期。
4. 对比 GitHub Flow(main+feature持续部署)与 Trunk-Based。
5. feature 到发布完整命令流程。

<span class="out">【输出格式】</span>
- GitFlow 分支图(文字版)与合并规则。
- feature→release→hotfix 命令示例。
- GitFlow vs GitHub Flow 选型建议。`},
{t:"定位 bug 引入提交(log/blame/二分)",p:`<span class="label">【角色】</span>你是 Git 考古与排障工程师。

<span class="label">【任务】</span>一行代码疑似致 bug，找是谁/哪个提交/为何引入：
1. git blame <file> 查看每行最后修改提交/作者/时间。
2. git blame -L 40,60 只看行范围。
3. git show <commit> 查完整改动与 message。
4. git log -S "关键字"(pickaxe) 找引入或删除字符串的提交。
5. git log -G "正则" 按正则搜改动。
6. git log --oneline -p <file> 查历史逐次改动。
7. 结合 git bisect 二分定位。
8. 定位后应理解原因而非追责。

<span class="out">【输出格式】</span>
- blame/show/log -S/log -G 命令示例。
- "定位某函数被删除提交"完整流程。
- blame -w 忽略空白变更。`},
{t:"清理已合并的本地与远程分支",p:`<span class="label">【角色】</span>你是 Git 仓库卫生工程师。

<span class="label">【任务】</span>大量已合并 feature 分支堆积，需清理：
1. git branch --merged 查已合并本地分支。
2. git branch -d <branch> 删除(-d 拒绝未合并，安全；-D 强制)。
3. 一键清理：git branch --merged | grep -v '^\\*\\|main\\|develop' | xargs git branch -d。
4. 删远程：git push origin --delete <branch>。
5. 清理远程已删分支的本地引用：git fetch --prune。
6. 删除前确认分支已合入目标分支。

<span class="out">【输出格式】</span>
- 本地与远程清理命令序列。
- --prune 示例。
- 建议定期清理与保护 main/develop 规则。`}
]}

];
const CHANGELOG = [
  {ver:"v1.2",date:"2026-08-11",tag:"新增",tagCls:"tag-new",desc:"新增「Git工作流」分类10条；补充 bisect、cherry-pick、rebase 等实战场景；优化性能优化分类的虚拟滚动与 Web Worker 示例。"},
  {ver:"v1.1",date:"2026-07-20",tag:"优化",tagCls:"tag-up",desc:"对代码生成分类的5条提示词补充了具体数据结构与边界条件；统一所有提示词的「角色+任务+输出格式」三段式结构；修复 SQL 分类中递归 CTE 示例的语法问题。"},
  {ver:"v1.0",date:"2026-06-15",tag:"发布",tagCls:"tag-new",desc:"首个正式版，包含代码生成、Bug调试、代码重构、单元测试、代码审查、性能优化、正则表达式、SQL查询、文档生成9大分类共90条提示词。"}
];
// 渲染分类导航
const navInner = document.getElementById('catNavInner');
DATA.forEach((c, i) => {
  const a = document.createElement('a');
  a.href = '#cat-' + i;
  a.innerHTML = '<span class="idx">' + String(i+1).padStart(2,'0') + '</span>' + c.cat;
  navInner.appendChild(a);
});

// 渲染提示词卡片
const main = document.getElementById('main');
DATA.forEach((c, i) => {
  const sec = document.createElement('section');
  sec.className = 'cat';
  sec.id = 'cat-' + i;
  let cards = '';
  c.items.forEach((item, j) => {
    cards += '<div class="card">'
      + '<div class="card-top">'
      + '<span class="card-no">#' + String(j+1).padStart(2,'0') + '</span>'
      + '<div class="card-title">' + item.t + '</div>'
      + '<button class="copy-btn" type="button" data-idx="' + i + '-' + j + '">复制</button>'
      + '</div>'
      + '<div class="prompt-body">' + item.p + '</div>'
      + '</div>';
  });
  sec.innerHTML = '<div class="cat-head">'
    + '<div class="cat-icon">' + c.icon + '</div>'
    + '<div><div class="cat-title">' + c.cat + '</div>'
    + '<div class="cat-meta">CATEGORY / ' + String(i+1).padStart(2,'0') + '</div></div>'
    + '<span class="cat-count">' + c.items.length + ' 条</span>'
    + '</div><div class="grid">' + cards + '</div>';
  main.appendChild(sec);
});

// 复制纯文本（去除 HTML 标签）
function toPlain(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}

// 复制到剪贴板
const toast = document.getElementById('toast');
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('.copy-btn');
  if (!btn) return;
  const [ci, ii] = btn.dataset.idx.split('-').map(Number);
  const text = toPlain(DATA[ci].items[ii].p).trim();
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    btn.classList.add('copied');
    btn.textContent = '已复制';
    showToast('已复制到剪贴板');
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.textContent = '复制';
    }, 1600);
  } catch (err) {
    showToast('复制失败，请手动选择文本');
  }
});

// 渲染更新日志
const logEl = document.getElementById('changelog');
CHANGELOG.forEach(l => {
  const div = document.createElement('div');
  div.className = 'log-item';
  div.innerHTML = '<span class="log-ver">' + l.ver + '</span>'
    + '<span class="log-date">' + l.date + '</span>'
    + '<span class="log-tag ' + l.tagCls + '">' + l.tag + '</span>'
    + '<div class="log-desc">' + l.desc + '</div>';
  logEl.appendChild(div);
});

// 回到顶部
const toTop = document.getElementById('toTop');
window.addEventListener('scroll', () => {
  toTop.classList.toggle('show', window.scrollY > 400);
}, { passive: true });
toTop.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
</script>
